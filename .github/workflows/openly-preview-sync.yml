name: Openly UI preview sync

on:
  push:
    branches: [openly-ui-preview]
    paths:
      - '.github/workflows/openly-preview-sync.yml'

permissions:
  contents: write

jobs:
  sync-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch redesigned Openly source
        run: |
          git clone --depth 1 --branch openly-ui-redesign https://github.com/dopaxxer/Khaled-openly.git /tmp/openly
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/openly/ ./

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify preview build
        run: |
          npm ci
          npm run build

      - name: Commit exact preview source
        run: |
          rm -rf .next node_modules
          git config user.name 'openly-preview-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Preview Openly UI redesign'
          git push origin HEAD:openly-ui-preview
